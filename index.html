<style>
:root{
  --bg:#f4f6fb; --ink:#131a2e; --ink2:#4a5570; --ink3:#8792ad;
  --line:#e3e7f2; --card:#ffffff;
  --blue:#3b6ef0; --gold:#e0a020; --red:#e0453a;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,70,.05), 0 8px 24px -12px rgba(20,30,70,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#eef2fb 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0d1b3d 0%,#1d3a7a 45%,#2f6bb4 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 320px at 12% -10%,rgba(120,190,255,.35),transparent 60%),
  radial-gradient(600px 300px at 88% 0%,rgba(255,190,80,.2),transparent 60%)}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:78ch;color:rgba(255,255,255,.76);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(20,30,70,.5)}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,240,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none}
.tgl:hover{border-color:#c9d2ea}
.tgl.on{background:linear-gradient(180deg,#3b6ef0,#2b56cc);border-color:#2b56cc;color:#fff;font-weight:600}
.tgl.gold.on{background:linear-gradient(180deg,#e8a92c,#cf8f0f);border-color:#cf8f0f;color:#3a2600}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grp .tgl{border:none;border-radius:0;font-size:13px;padding:9px 13px}
.grp .tgl+ .tgl{border-left:1px solid var(--line)}
.grp .tgl.on{font-weight:600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
main{padding:20px 0 70px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd8ee}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .stripe{height:3px;background:var(--hc,#94a3b8)}
.thumb{position:relative;aspect-ratio:694/220;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#fbfcff,#eceff9);border-bottom:1px solid #f0f2fa;overflow:hidden}
.thumb .stack{position:relative;height:82%;max-width:90%;aspect-ratio:694/170}
.thumb .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumb .solo{height:74%;max-width:86%;display:flex;align-items:center;justify-content:center}
.thumb .solo img{max-width:100%;max-height:100%;object-fit:contain}
.card:hover .thumb img{transform:scale(1.03)}
.badge-pair{position:absolute;top:7px;right:7px;z-index:2;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px;background:#e8f4ec;color:#1a7a4a;border:1px solid #bfe3cd}
.badge-half{background:#fdf3e2;color:#8a5c00;border:1px solid #f0dcb2}
.badge-bg{background:#e8efff;color:#25459e;border:1px solid #c3d2f7}
.badge-fg{background:#f3e9ff;color:#6d3bb5;border:1px solid #dcc9f7}
.csub{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{font-size:11px;padding:2px 7px;border-radius:6px;background:#f1f4fb;color:#4a5570;font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(15,21,44,.55);backdrop-filter:blur(4px)}
.lb-panel{position:relative;background:#fff;border-radius:18px;width:min(900px,100%);max-height:88vh;overflow:auto;

.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:16px}

footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:22px 0 40px}
footer code{background:#eef1f8;padding:1.5px 5px;border-radius:5px;font-size:12px;color:var(--ink2)}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}

const B = META.banners;
const P = META.pieces || [];
const IMG = META.css;

const FLAG = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 21V4m0 1h13l-3 4 3 4H5"/></svg>';

(function(){
  const pair = B.filter(b=>b.bg&&b.fg).length;
  const bgOnly = B.filter(b=>b.bg&&!b.fg).length;
  const fgOnly = B.filter(b=>!b.bg&&b.fg).length;
  const own = B.filter(b=>b.own).length;
  document.getElementById('lead').textContent =
    ``;
  const S=[[B.length,"战旗组数"],[pair,"背景+前景齐全"],[P.length,"部件总数"],[own,"默认拥有"]];
  document.getElementById('stats').innerHTML = S.map(([v,l],i)=>
    `<div class="stat${i===1?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const drop = META.droppedCount | 0;
  if(drop) document.getElementById('f-drop').textContent =
    ``;
})();

const boxCount={};
B.concat(P).forEach(x=>{ if(x.box) boxCount[x.box]=(boxCount[x.box]||0)+1; });
document.getElementById('box').innerHTML = '<option value="">全部上架位置</option>' +
  Object.keys(boxCount).sort().map(k=>`<option value="${k}">${k} (${boxCount[k]})</option>`).join('');

const S = {mode:"pair", q:"", box:"", ty:"", sort:"idx", full:false, dflt:false};
function hay(x){
  return [x.t,x.n,x.k,x.box,x.sc,x.g,x.gt].filter(Boolean).join(" ").toLowerCase();
}
function match(x){
  if(S.box && x.box!==S.box) return false;
  if(S.dflt && !x.own) return false;
  if(S.mode==="piece"){ if(S.ty && x.ty!==S.ty) return false; }
  else if(S.full && !(x.bg&&x.fg)) return false;
  if(S.q && !S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay(x).includes(w))) return false;
  return true;
}
function sortList(a,b){
  if(S.sort==="name") return (a.t||a.n).localeCompare(b.t||b.n);
  if(S.sort==="box") return (a.box||"~").localeCompare(b.box||"~") || (a.t||a.n).localeCompare(b.t||b.n);
  return idx(a)-idx(b);
}
const IDX_B = new Map(B.map((b,i)=>[b,i]));
const IDX_P = new Map(P.map((p,i)=>[p,i]));
function idx(x){ return (S.mode==="piece"?IDX_P:IDX_B).get(x) ?? 0; }
function src(){ return S.mode==="piece"?P:B; }

const grid=document.getElementById('grid'), countEl=document.getElementById('count'), emptyEl=document.getElementById('empty');
let VIEW=[];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function stack(b){
  if(b.bg&&b.fg) return `<div class="stack"><img loading="lazy" decoding="async" src="${IMG}${b.bg}" alt=""><img loading="lazy" decoding="async" src="${IMG}${b.fg}" alt=""></div>`;
  const src=b.bg||b.fg;
  return `<div class="solo"><img loading="lazy" decoding="async" src="${IMG}${src}" alt="${esc(b.t)}"></div>`;
}
function pieceCard(p){
  const bg = p.ty==="bg";
  return `<article class="card" tabindex="0" data-n="${esc(p.n)}">
    <div class="stripe" style="--hc:${bg?'#3b6ef0':'#a855f7'}"></div>
    <div class="thumb">
      <div class="solo"><img loading="lazy" decoding="async" src="${IMG}${p.p}" alt="${esc(p.t)}"></div>
      <div class="badge-pair ${bg?'badge-bg':'badge-fg'}">${bg?'背景':'前景'}</div>
    </div>
    <div class="cbody">
      <div class="cname">${esc(p.t||p.n)}</div>
      <div class="cmeta">
        ${p.k?`<span class="fam">${esc(p.k)}</span>`:""}
        ${p.own?`<span class="fam" style="background:#fff6e0;color:#8a5c00">默认拥有</span>`:""}
        ${p.box?`<span class="yr">${esc(p.box)}</span>`:""}
      </div>
      ${p.gt?`<div class="csub">属于：${esc(p.gt)}</div>`:""}
    </div>
  </article>`;
}
function card(b){
  if(S.mode==="piece") return pieceCard(b);
  const full=b.bg&&b.fg;
  return `<article class="card" tabindex="0" data-n="${esc(b.n)}">
    <div class="stripe" style="--hc:${full?'#3fa85f':'#e0a020'}"></div>
    <div class="thumb">${stack(b)}
      <div class="badge-pair ${full?'':'badge-half'}" title="${full?'背景 + 前景齐全':'仅 '+(b.bg?'背景':'前景')+' 单件'}">${full?'成对':'单件'}</div>
    </div>
    <div class="cbody">
      <div class="cname">${esc(b.t||b.n)}</div>
      <div class="cmeta">
        ${b.k?`<span class="fam">${esc(b.k)}</span>`:""}
        ${b.own?`<span class="fam" style="background:#fff6e0;color:#8a5c00">默认拥有</span>`:""}
        ${b.box?`<span class="yr">${esc(b.box)}</span>`:""}
      </div>
    </div>
  </article>`;
}
function render(){
  const SRC=src();
  VIEW=SRC.filter(match).sort(sortList);
  countEl.innerHTML = S.mode==="piece"
    ? `显示 <b>${VIEW.length}</b> / ${P.length} 件部件（背景 ${META.pieceBg||0} · 前景 ${META.pieceFg||0}）`
    : `显示 <b>${VIEW.length}</b> / ${B.length} 组战旗`;
  document.getElementById('tip').textContent = S.mode==="piece"
    ? "单件视图：背景与前景分开浏览"
    : "配对视图：背景 + 前景叠加显示游戏内实际效果";
  emptyEl.style.display=VIEW.length?"none":"block";
  emptyEl.textContent = S.mode==="piece"?"没有符合条件的部件，试试放宽筛选条件。":"没有符合条件的战旗，试试放宽筛选条件。";
  grid.innerHTML=VIEW.map(card).join('');
}
grid.addEventListener('click',ev=>{
  const c=ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(b=>b.n===c.dataset.n));
});
grid.addEventListener('keydown',ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const c=ev.target.closest('.card'); if(!c) return;
  ev.preventDefault(); openBy(VIEW.findIndex(b=>b.n===c.dataset.n));
});

const lb=document.getElementById('lb');
let cur=-1;
function openBy(i){
  if(i<0||i>=VIEW.length) return;
  cur=i; const b=VIEW[i];
  if(S.mode==="piece") return openPiece(b);
  const vis=document.getElementById('lb-vis');
  if(b.bg&&b.fg){
    vis.innerHTML=`<div class="stack"><img src="${IMG}${b.bg}" alt="${esc(b.t)}"><img src="${IMG}${b.fg}" alt=""></div>`;
  }else{
    vis.innerHTML=`<div style="width:100%;text-align:center"><img src="${IMG}${b.bg||b.fg}" alt="${esc(b.t)}" style="max-width:100%;max-height:200px;object-fit:contain"></div>`;
  }
  const parts=[["背景 Background",b.bg],["前景 Foreground",b.fg]].filter(p=>p[1]);
  const tgs=[];
  if(b.own) tgs.push('<span class="tg b">开局默认拥有</span>');
  if(b.bg&&b.fg) tgs.push('<span class="tg g">背景 + 前景</span>');
  if(b.box) tgs.push(`<span class="tg">${esc(b.box)}</span>`);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(b.t||b.n)}</h2>
    <div class="lb-sub">${b.k?esc(b.k)+" · ":""}${b.box?esc(b.box):"未标注上架位置"}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <div class="lb-parts">${parts.map(p=>`<figure><figcaption>${p[0]}</figcaption><img loading="lazy" src="${IMG}${p[1]}" alt=""></figure>`).join('')}</div>
    <dl style="margin-top:16px">
      <dt>配对 Key</dt><dd>${esc(b.n)}</dd>
      <dt>战旗编号</dt><dd>${esc(b.k||"—")}</dd>
      <dt>精灵文件</dt><dd>${b.sc.map(esc).join("<br>")||"—"}</dd>
    </dl>`;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function openPiece(p){
  const bg=p.ty==="bg";
  document.getElementById('lb-vis').innerHTML=
    `<div style="width:100%;text-align:center"><img src="${IMG}${p.p}" alt="${esc(p.t)}" style="max-width:100%;max-height:220px;object-fit:contain"></div>`;
  const tgs=[`<span class="tg ${bg?'b':''}">${bg?'背景 Background':'前景 Foreground'}</span>`];
  if(p.own) tgs.push('<span class="tg g">开局默认拥有</span>');
  if(p.box) tgs.push(`<span class="tg">${esc(p.box)}</span>`);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(p.t||p.n)}</h2>
    <div class="lb-sub">${p.k?esc(p.k)+" · ":""}${p.gt?esc(p.gt):"未配对"}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <dl style="margin-top:16px">
      <dt>部件名</dt><dd>${esc(p.n)}</dd>
      <dt>类型</dt><dd>${bg?"Background 背景":"Foreground 前景"}</dd>
      <dt>所属战旗</dt><dd>${esc(p.gt||"—")}</dd>
      <dt>战旗编号</dt><dd>${esc(p.k||"—")}</dd>
      <dt>上架位置</dt><dd>${esc(p.box||"—")}</dd>
      <dt>精灵文件</dt><dd>${esc(p.sc||"—")}</dd>
    </dl>`;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
lb.addEventListener('click',ev=>{ if(ev.target.hasAttribute('data-close')) close(); });
document.getElementById('prev').onclick=()=>openBy(cur-1);
document.getElementById('next').onclick=()=>openBy(cur+1);
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('open')) return;
  if(ev.key==="Escape") close();
  if(ev.key==="ArrowLeft") openBy(cur-1);
  if(ev.key==="ArrowRight") openBy(cur+1);
});

let timer;
document.getElementById('q').addEventListener('input',ev=>{
  clearTimeout(timer); const v=ev.target.value;
  timer=setTimeout(()=>{S.q=v.trim(); render();},120);
});
document.getElementById('box').onchange=ev=>{S.box=ev.target.value; render();};
document.getElementById('sort').onchange=ev=>{S.sort=ev.target.value; render();};
function tgl(id,key){
  const el=document.getElementById(id);
  el.onclick=()=>{S[key]=!S[key]; el.classList.toggle('on',S[key]); render();};
}
tgl('t-full','full'); tgl('t-do','dflt');
const tyEl=document.getElementById('ty');
tyEl.onchange=ev=>{S.ty=ev.target.value; render();};
function setMode(m){
  S.mode=m;
  document.getElementById('m-pair').classList.toggle('on',m==='pair');
  document.getElementById('m-piece').classList.toggle('on',m==='piece');
  document.getElementById('t-full').style.display = m==='pair'?'':'none';
  tyEl.style.display = m==='piece'?'':'none';
  render();
}
document.getElementById('m-pair').onclick=()=>setMode('pair');
document.getElementById('m-piece').onclick=()=>setMode('piece');
document.getElementById('reset').onclick=()=>{
  S.q="";S.box="";S.ty="";S.sort="idx";S.full=false;S.dflt=false;
  document.getElementById('q').value="";document.getElementById('box').value="";
  tyEl.value="";document.getElementById('sort').value="idx";
  document.querySelectorAll('.tgl.on').forEach(el=>{ if(el.id!=="m-pair"&&el.id!=="m-piece") el.classList.remove('on'); });
  setMode(S.mode);
};
setMode('pair');
</script>
</body>
</html>
