<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">皇室战争 战旗图鉴 · Clash Royale Banner Gallery</title>
<style>
:root{
  --bg:#f4f6fb; --ink:#131a2e; --ink2:#4a5570; --ink3:#8792ad;
  --line:#e3e7f2; --card:#ffffff;
  --blue:#3b6ef0; --gold:#e0a020; --red:#e0453a;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,70,.05), 0 8px 24px -12px rgba(20,30,70,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#eef2fb 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0d1b3d 0%,#1d3a7a 45%,#2f6bb4 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 320px at 12% -10%,rgba(120,190,255,.35),transparent 60%),
  radial-gradient(600px 300px at 88% 0%,rgba(255,190,80,.2),transparent 60%)}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:78ch;color:rgba(255,255,255,.76);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(20,30,70,.5)}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,240,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none}
.tgl:hover{border-color:#c9d2ea}
.tgl.on{background:linear-gradient(180deg,#3b6ef0,#2b56cc);border-color:#2b56cc;color:#fff;font-weight:600}
.tgl.gold.on{background:linear-gradient(180deg,#e8a92c,#cf8f0f);border-color:#cf8f0f;color:#3a2600}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grp .tgl{border:none;border-radius:0;font-size:13px;padding:9px 13px}
.grp .tgl+ .tgl{border-left:1px solid var(--line)}
.grp .tgl.on{font-weight:600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
main{padding:20px 0 70px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd8ee}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .stripe{height:3px;background:var(--hc,#94a3b8)}
.thumb{position:relative;aspect-ratio:694/220;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#fbfcff,#eceff9);border-bottom:1px solid #f0f2fa;overflow:hidden}
.thumb .stack{position:relative;height:82%;max-width:90%;aspect-ratio:694/170}
.thumb .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumb .solo{height:74%;max-width:86%;display:flex;align-items:center;justify-content:center}
.thumb .solo img{max-width:100%;max-height:100%;object-fit:contain}
.card:hover .thumb img{transform:scale(1.03)}
.badge-pair{position:absolute;top:7px;right:7px;z-index:2;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px;background:#e8f4ec;color:#1a7a4a;border:1px solid #bfe3cd}
.badge-half{background:#fdf3e2;color:#8a5c00;border:1px solid #f0dcb2}
.badge-bg{background:#e8efff;color:#25459e;border:1px solid #c3d2f7}
.badge-fg{background:#f3e9ff;color:#6d3bb5;border:1px solid #dcc9f7}
.badge-anim{position:absolute;top:7px;left:7px;z-index:2;display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:999px;
  background:rgba(31,41,71,.62);color:#fff;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.csub{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{font-size:11px;padding:2px 7px;border-radius:6px;background:#f1f4fb;color:#4a5570;font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(15,21,44,.55);backdrop-filter:blur(4px)}
.lb-panel{position:relative;background:#fff;border-radius:18px;width:min(900px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(10,16,40,.55);display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr)}
@media(max-width:760px){.lb-panel{grid-template-columns:1fr}}
.lb-vis{background:radial-gradient(circle at 50% 40%,#f8faff,#e9eefb);display:flex;align-items:center;justify-content:center;padding:22px;border-right:1px solid var(--line)}
.lb-vis .stack{position:relative;width:100%;aspect-ratio:694/170}
.lb-vis .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lb-parts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.lb-parts figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.lb-parts figcaption{font-size:11px;color:var(--ink3);margin-bottom:4px}
.lb-parts img{max-height:90px;max-width:100%;object-fit:contain}
.lb-info{padding:22px 24px 26px;min-width:0}
.lb-info h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:16px}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f1f4fb;color:var(--ink2);font-weight:600}
.tg.g{background:#fff6e0;color:#8a5c00}
.tg.b{background:#e8efff;color:#25459e}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
dt{color:var(--ink3);white-space:nowrap}
dd{margin:0;color:var(--ink);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.lb-nav{position:absolute;top:12px;right:14px;display:flex;gap:6px}
.lb-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--ink2);font-size:15px;line-height:1;display:grid;place-items:center}
.lb-nav button:hover{background:#f4f6fb;border-color:#c9d2ea}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:22px 0 40px}
footer code{background:#eef1f8;padding:1.5px 5px;border-radius:5px;font-size:12px;color:var(--ink2)}
.disclaim{margin-top:18px;background:#eef3ff;border:1px solid #d8e2fb;border-radius:12px;
  padding:14px 16px;font-size:12.5px;line-height:1.75;color:var(--ink2)}
.disclaim h2{margin:0 0 8px;font-size:12.5px;font-weight:700;color:#1d3a7a;letter-spacing:.02em;
  display:flex;align-items:center;gap:7px}
.disclaim h2:before{content:"";width:3px;height:13px;border-radius:2px;background:#2f6bb4;flex:none}
.disclaim p{margin:0}
.disclaim a{color:#2f6bb4;text-decoration:underline;text-underline-offset:2px}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}
</style>
</head>
<body>

:"Complete"},"stPieces":{"zh":"部件总数","en":"Pieces"},"pieceBg":{"zh":"背景","en":"Background"},"pieceFg":{"zh":"前景","en":"Foreground"},"belongs":{"zh":"属于：","en":"Belongs to: "},"badgeFull":{"zh":"背景 + 前景齐全","en":"Background + foreground complete"},"badgeHalf":{"zh":"仅 {1} 单件","en":"Only {1}"},"paired":{"zh":"成对","en":"Paired"},"single":{"zh":"单件","en":"Single"},"countPiece":{"zh":"显示 <b>{1}</b> / {2} 件部件（背景 {3} · 前景 {4}）","en":"Showing <b>{1}</b> / {2} pieces (Background {3} · Foreground {4})"},"countBanner":{"zh":"显示 <b>{1}</b> / {2} 组战旗","en":"Showing <b>{1}</b> / {2} banners"},"tipPiece":{"zh":"单件视图：背景与前景分开浏览","en":"Piece view: background and foreground listed separately"},"tipPair":{"zh":"配对视图：背景 + 前景叠加显示游戏内实际效果","en":"Paired view: background + foreground stacked as in game"},"bgLabel":{"zh":"背景 Background","en":"Background"},"fgLabel":{"zh":"前景 Foreground","en":"Foreground"},"ownedDefault":{"zh":"开局默认拥有","en":"Owned by default"},"bgFg":{"zh":"背景 + 前景","en":"Background + foreground"},"noBox":{"zh":"未标注上架位置","en":"No release box listed"},"pairKey":{"zh":"配对 Key","en":"Pair key"},"bannerId":{"zh":"战旗编号","en":"Banner ID"},"spriteFile":{"zh":"精灵文件","en":"Sprite file"},"unpaired":{"zh":"未配对","en":"Unpaired"},"pieceName":{"zh":"部件名","en":"Piece name"},"type":{"zh":"类型","en":"Type"},"banner":{"zh":"所属战旗","en":"Banner"},"releaseBox":{"zh":"上架位置","en":"Release box"},"disclaimer":{"zh":"本内容为<b>非官方粉丝作品</b>，与 Supercell 无任何关联，亦未获其授权或认可。所有图像、动画、音频的版权归 <b>Supercell</b> 所有，仅用于学习与展示，不作商业用途。详见 <a href='https://www.supercell.com/fan-content-policy' target='_blank' rel='noopener noreferrer'>Supercell 粉丝内容政策</a>。","en":"This content is an <b>unofficial fan project</b> — not affiliated with, authorized, or endorsed by Supercell. All images, animations and sounds are copyright <b>Supercell</b>; used for study and display only, with no commercial use. See <a href='https://www.supercell.com/fan-content-policy' target='_blank' rel='noopener noreferrer'>Supercell's Fan Content Policy</a>."} window.LANG = (function(){ try{ return localStorage.getItem('cr-lang')==='en'?'en':'zh'; }catch(e){ return 'zh'; } })();
window.T = function(k){
  var e = window.I18N[k]; if(!e) return '';
  var s = (window.LANG === 'en' && e.en) ? e.en : e.zh;
  if(s == null) s = '';
  for(var i = 1; i < arguments.length; i++){
    s = s.split('{' + i + '}').join(arguments[i]);
  }
  return s;
};
function applyI18n(){
  document.title = T('title');
  document.documentElement.lang = window.LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = T(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){
    el.innerHTML = T(el.getAttribute('data-i18n-html'));
  });

<header class="hero">
  <div class="wrap">
    <div class="chip-top">CLASH ROYALE · <b>BANNER GALLERY</b></div>
    <h1 data-i18n-html="h1">皇室战争 <em>全部战旗</em> 图鉴</h1>

89":"62_AnimGoblinBush_FG.webp","Chronos590":"62_AnimGoblinBush_BG.webp","Chronos603":"63_Anim_PekkaMegaknight_FG.webp","Chronos604":"63_Anim_PekkaMegaknight_BG.webp","Chronos621":"64_Anim_GoblinsteinScientist_FG.webp","Chronos622":"64_Anim_GoblinsteinScientist_BG.webp","Chronos633":"65_Anim_MusketeerEvo_FG.webp","Chronos634":"65_Anim_MusketeerEvo_BG.webp","Chronos649":"66_Anim_CozyWinter_FG.webp","Chronos650":"66_Anim_CozyWinter_BG.webp","Chronos665":"67_Anim_RuneGiant_FG.webp","Chronos679":"68_GoingBerserk_FG.webp","Chronos680":"68_GoingBerserk_BG.webp","Chronos693":"69_AnimatedBirthday_FG.webp","Chronos694":"69_AnimatedBirthday_BG.webp","Chronos711":"70_TheBanditBoss_FG.webp","Chronos712":"70_TheBanditBoss_BG.webp","Chronos727":"71_GraveyardKid_FG.webp","Chronos728":"71_GraveyardKid_BG.webp","Chronos743":"72_InfernoBBQ_FG.webp","Chronos744":"72_InfernoBBQ_BG.webp","Chronos761":"MergeMaidenFG_dl.webp","Chronos762":"MergeMaidenBG_dl.webp","Chronos799":"furnace_FG_dl.webp","Chronos800":"furnace_BG_dl.webp"}};
const B = META.banners;
const P = META.pieces || [];
const IMG = META.css;
/* 动图：META.anim 是 {PNG 主名: 动图文件名} 映射（动图文件名沿用精灵名） */
const ANIM = META.anim || {};
const ANIMCSS = META.animCss || "assets/anim/";
function animOf(png){
  if(!png) return "";
  const f = ANIM[png.replace(/\.png$/i, "")];
  return f ? ANIMCSS + f : "";
}
function layer(png, alt){
  const a = animOf(png);
  return `<img loading="lazy" decoding="async" src="${IMG}${png}" alt="${alt}"` +
         (a?` data-anim="${a}" data-static="${IMG}${png}"`:"") + `>`;
}
/* 动图徽章：卡片是运行时渲染的，i18n 得走 T()（applyI18n 只扫静态节点） */
function animBadge(){
  return '<div class="badge-anim" title="' + T("animTip") + '">▶ ' + T("animBadge") + '</div>';
}

const FLAG = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 21V4m0 1h13l-3 4 3 4H5"/></svg>';

function buildStats(){
  const pair = B.filter(b=>b.bg&&b.fg).length;
  const animB = B.filter(b=>animOf(b.bg)||animOf(b.fg)).length;
  const own = B.filter(b=>b.own).length;
  document.getElementById('lead').textContent =
    ``;
  /* 第三项 true = 高亮（warn 金色）；动图战旗紧跟总数之后 */
  const rows=[[B.length,T("stBanners"),false],[animB,T("stAnim"),false],
              [pair,T("stPaired"),true],[P.length,T("stPieces"),false],[own,T("own"),false]];
  document.getElementById('stats').innerHTML = rows.map(([v,l,hl])=>
    `<div class="stat${hl?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const drop = META.droppedCount | 0;
  if(drop) document.getElementById('f-drop').textContent =
    ``;
}
buildStats();

const boxCount={};
B.concat(P).forEach(x=>{ if(x.box) boxCount[x.box]=(boxCount[x.box]||0)+1; });
/* 上架位置原始值形如 "Season 37_Box1"：显示按语言本地化，
   中文 → 第 37 赛季 · 礼盒 1；英文 → Season 37 · Box 1。
   option 的 value 始终保持原始 Key，筛选 / 排序逻辑不受影响。 */
function boxLabel(k){
  if(!k) return "";
  const m=/^Season\s*(\d+)(?:[_ ]?Box\s*(\d+))?$/i.exec(String(k));
  if(!m) return k;
  return window.LANG==='en'
    ? (m[2] ? `Season ${m[1]} · Box ${m[2]}` : `Season ${m[1]}`)
    : (m[2] ? `第 ${m[1]} 赛季 · 礼盒 ${m[2]}` : `第 ${m[1]} 赛季`);
}
const boxSel=document.getElementById('box');
function buildBoxOptions(){
  const cur=boxSel.value;                 // 重建前记住选中项，切语言不丢筛选
  boxSel.innerHTML = '<option value="">'+T("boxAll")+'</option>' +
    Object.keys(boxCount).sort().map(k=>`<option value="${esc(k)}">${esc(boxLabel(k))} (${boxCount[k]})</option>`).join('');
  boxSel.value=cur;
}
buildBoxOptions();

const S = {mode:"pair", q:"", box:"", ty:"", sort:"idx", anim:false, dflt:false};
function hay(x){
  return [x.t,x.n,x.k,x.box,x.sc,x.g,x.gt].filter(Boolean).join(" ").toLowerCase();
}
function match(x){
  if(S.box && x.box!==S.box) return false;
  if(S.dflt && !x.own) return false;
  if(S.mode==="piece"){
    if(S.ty && x.ty!==S.ty) return false;
    if(S.anim && !animOf(x.p)) return false;          // 单件视图：该件本身有动图
  }else if(S.anim && !(animOf(x.bg)||animOf(x.fg))) return false;  // 配对视图：背景或前景有动图
  if(S.q && !S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay(x).includes(w))) return false;
  return true;
}
function sortList(a,b){
  if(S.sort==="name") return (a.t||a.n).localeCompare(b.t||b.n);
  if(S.sort==="box") return (a.box||"~").localeCompare(b.box||"~") || (a.t||a.n).localeCompare(b.t||b.n);
  return idx(a)-idx(b);
}
const IDX_B = new Map(B.map((b,i)=>[b,i]));
const IDX_P = new Map(P.map((p,i)=>[p,i]));
function idx(x){ return (S.mode==="piece"?IDX_P:IDX_B).get(x) ?? 0; }
function src(){ return S.mode==="piece"?P:B; }

const grid=document.getElementById('grid'), countEl=document.getElementById('count'), emptyEl=document.getElementById('empty');
let VIEW=[];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function stack(b){
  if(b.bg&&b.fg) return `<div class="stack">${layer(b.bg,"")}${layer(b.fg,"")}</div>`;
  const src=b.bg||b.fg;
  return `<div class="solo">${layer(src, esc(b.t))}</div>`;
}
function pieceCard(p){
  const bg = p.ty==="bg";
  return `<article class="card" tabindex="0" data-n="${esc(p.n)}">
    <div class="stripe" style="--hc:${bg?'#3b6ef0':'#a855f7'}"></div>
    <div class="thumb">
      <div class="solo">${layer(p.p, esc(p.t))}</div>
      ${animOf(p.p)?animBadge():""}
      <div class="badge-pair ${bg?'badge-bg':'badge-fg'}">${T(bg?'pieceBg':'pieceFg')}</div>
    </div>
    <div class="cbody">
      <div class="cname">${esc(p.t||p.n)}</div>
      <div class="cmeta">
        ${p.k?`<span class="fam">${esc(p.k)}</span>`:""}
        ${p.own?`<span class="fam" style="background:#fff6e0;color:#8a5c00">${T("own")}</span>`:""}
        ${p.box?`<span class="yr">${esc(boxLabel(p.box))}</span>`:""}
      </div>
      ${p.gt?`<div class="csub">${T("belongs")}${esc(p.gt)}</div>`:""}
    </div>
  </article>`;
}
function card(b){
  if(S.mode==="piece") return pieceCard(b);
  const full=b.bg&&b.fg;
  return `<article class="card" tabindex="0" data-n="${esc(b.n)}">
    <div class="stripe" style="--hc:${full?'#3fa85f':'#e0a020'}"></div>
    <div class="thumb">${stack(b)}
      ${(animOf(b.bg)||animOf(b.fg))?animBadge():""}
      <div class="badge-pair ${full?'':'badge-half'}" title="${full?T('badgeFull'):T('badgeHalf',T(b.bg?'pieceBg':'pieceFg'))}">${full?T('paired'):T('single')}</div>
    </div>
    <div class="cbody">
      <div class="cname">${esc(b.t||b.n)}</div>
      <div class="cmeta">
        ${b.k?`<span class="fam">${esc(b.k)}</span>`:""}
        ${b.own?`<span class="fam" style="background:#fff6e0;color:#8a5c00">${T("own")}</span>`:""}
        ${b.box?`<span class="yr">${esc(boxLabel(b.box))}</span>`:""}
      </div>
    </div>
  </article>`;
}
function render(){
  const SRC=src();
  VIEW=SRC.filter(match).sort(sortList);
  countEl.innerHTML = S.mode==="piece"
    ? T('countPiece', VIEW.length, P.length, META.pieceBg||0, META.pieceFg||0)
    : T('countBanner', VIEW.length, B.length);
  document.getElementById('tip').textContent = S.mode==="piece"
    ? T('tipPiece')+" · "+T('tipNote')
    : T('tipPair')+" · "+T('tipNote');
  emptyEl.style.display=VIEW.length?"none":"block";
  emptyEl.textContent = S.mode==="piece"?T('emptyPiece'):T('empty');
  hovCard=null; hovTimer=null;            // 重排后旧卡片已不存在，清掉悬停播放状态
  grid.innerHTML=VIEW.map(card).join('');
}
grid.addEventListener('click',ev=>{
  const c=ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(b=>b.n===c.dataset.n));
});
grid.addEventListener('keydown',ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const c=ev.target.closest('.card'); if(!c) return;
  ev.preventDefault(); openBy(VIEW.findIndex(b=>b.n===c.dataset.n));
});

/* ---------- 悬停播放动画（按需加载；一组战旗的背景 + 前景一起换，保持同步） ---------- */
let hovCard=null, hovTimer=null;
function cardImgs(c){ return c? [].slice.call(c.querySelectorAll('.thumb img[data-anim]')) : []; }
function toAnim(c){
  const imgs=cardImgs(c).filter(i=>!i.classList.contains('anim-on'));
  if(!imgs.length) return;
  let left=imgs.length;
  const go=()=>{                       // 全部就绪后一次性切换：背景 / 前景同时起播，不脱拍
    if(--left) return;
    imgs.forEach(i=>{ i.src=i.dataset.anim; i.classList.add('anim-on'); i.dataset.loaded="1"; });
  };
  imgs.forEach(i=>{
    if(i.dataset.loaded||i.dataset.pre){ go(); return; }
    i.dataset.pre="1";
    const p=new Image(); p.onload=go; p.onerror=go; p.src=i.dataset.anim;
  });
}
function toStatic(c){
  cardImgs(c).forEach(i=>{
    if(!i.classList.contains('anim-on')) return;
    i.src=i.dataset.static; i.classList.remove('anim-on');
  });
}
grid.addEventListener('mouseover',ev=>{
  const c=ev.target.closest('.card');
  if(c===hovCard) return;
  clearTimeout(hovTimer);
  if(hovCard) toStatic(hovCard);
  hovCard=c;
  if(!c||!c.querySelector('.thumb img[data-anim]')) return;
  hovTimer=setTimeout(()=>toAnim(c),110);
});
grid.addEventListener('mouseleave',()=>{
  clearTimeout(hovTimer);
  if(hovCard) toStatic(hovCard);
  hovCard=null;
});

const lb=document.getElementById('lb');
let cur=-1;
function openBy(i){
  if(i<0||i>=VIEW.length) return;
  cur=i; const b=VIEW[i];
  if(S.mode==="piece") return openPiece(b);
  const vis=document.getElementById('lb-vis');
  if(b.bg&&b.fg){
    const ab=animOf(b.bg), af=animOf(b.fg);
    vis.innerHTML=`<div class="stack"><img src="${ab||IMG+b.bg}" alt="${esc(b.t)}"><img src="${af||IMG+b.fg}" alt=""></div>`;
  }else{
    const s=b.bg||b.fg;
    vis.innerHTML=`<div style="width:100%;text-align:center"><img src="${animOf(s)||IMG+s}" alt="${esc(b.t)}" style="max-width:100%;max-height:200px;object-fit:contain"></div>`;
  }
  const parts=[[T("bgLabel"),b.bg],[T("fgLabel"),b.fg]].filter(p=>p[1]);
  const tgs=[];
  if(b.own) tgs.push('<span class="tg b">'+T("ownedDefault")+'</span>');
  if(b.bg&&b.fg) tgs.push('<span class="tg g">'+T("bgFg")+'</span>');
  if(b.box) tgs.push(`<span class="tg">${esc(boxLabel(b.box))}</span>`);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(b.t||b.n)}</h2>
    <div class="lb-sub">${b.k?esc(b.k)+" · ":""}${b.box?esc(boxLabel(b.box)):T("noBox")}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <div class="lb-parts">${parts.map(p=>`<figure><figcaption>${p[0]}</figcaption><img loading="lazy" src="${animOf(p[1])||IMG+p[1]}" alt=""></figure>`).join('')}</div>
    <dl style="margin-top:16px">
      <dt>${T("pairKey")}</dt><dd>${esc(b.n)}</dd>
      <dt>${T("bannerId")}</dt><dd>${esc(b.k||"—")}</dd>
      <dt>${T("spriteFile")}</dt><dd>${b.sc.map(esc).join("<br>")||"—"}</dd>
    </dl>`;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function openPiece(p){
  const bg=p.ty==="bg";
  document.getElementById('lb-vis').innerHTML=
    `<div style="width:100%;text-align:center"><img src="${animOf(p.p)||IMG+p.p}" alt="${esc(p.t)}" style="max-width:100%;max-height:220px;object-fit:contain"></div>`;
  const tgs=[`<span class="tg ${bg?'b':''}">${T(bg?'bgLabel':'fgLabel')}</span>`];
  if(p.own) tgs.push('<span class="tg g">'+T("ownedDefault")+'</span>');
  if(p.box) tgs.push(`<span class="tg">${esc(boxLabel(p.box))}</span>`);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(p.t||p.n)}</h2>
    <div class="lb-sub">${p.k?esc(p.k)+" · ":""}${p.gt?esc(p.gt):T("unpaired")}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <dl style="margin-top:16px">
      <dt>${T("pieceName")}</dt><dd>${esc(p.n)}</dd>
      <dt>${T("type")}</dt><dd>${T(bg?'bgLabel':'fgLabel')}</dd>
      <dt>${T("banner")}</dt><dd>${esc(p.gt||"—")}</dd>
      <dt>${T("bannerId")}</dt><dd>${esc(p.k||"—")}</dd>
      <dt>${T("releaseBox")}</dt><dd>${esc(p.box?boxLabel(p.box):"—")}</dd>
      <dt>${T("spriteFile")}</dt><dd>${esc(p.sc||"—")}</dd>
    </dl>`;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
lb.addEventListener('click',ev=>{ if(ev.target.hasAttribute('data-close')) close(); });
document.getElementById('prev').onclick=()=>openBy(cur-1);
document.getElementById('next').onclick=()=>openBy(cur+1);
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('open')) return;
  if(ev.key==="Escape") close();
  if(ev.key==="ArrowLeft") openBy(cur-1);
  if(ev.key==="ArrowRight") openBy(cur+1);
});

let timer;
document.getElementById('q').addEventListener('input',ev=>{
  clearTimeout(timer); const v=ev.target.value;
  timer=setTimeout(()=>{S.q=v.trim(); render();},120);
});
document.getElementById('box').onchange=ev=>{S.box=ev.target.value; render();};
document.getElementById('sort').onchange=ev=>{S.sort=ev.target.value; render();};
function tgl(id,key){
  const el=document.getElementById(id);
  el.onclick=()=>{S[key]=!S[key]; el.classList.toggle('on',S[key]); render();};
}
tgl('t-full','anim'); tgl('t-do','dflt');
const tyEl=document.getElementById('ty');
tyEl.onchange=ev=>{S.ty=ev.target.value; render();};
function setMode(m){
  S.mode=m;
  document.getElementById('m-pair').classList.toggle('on',m==='pair');
  document.getElementById('m-piece').classList.toggle('on',m==='piece');
  document.getElementById('t-full').style.display = '';   // 动图筛选在两种视图下都可用
  tyEl.style.display = m==='piece'?'':'none';
  render();
}
document.getElementById('m-pair').onclick=()=>setMode('pair');
document.getElementById('m-piece').onclick=()=>setMode('piece');
document.getElementById('reset').onclick=()=>{
  S.q="";S.box="";S.ty="";S.sort="idx";S.anim=false;S.dflt=false;
  document.getElementById('q').value="";document.getElementById('box').value="";
  tyEl.value="";document.getElementById('sort').value="idx";
  document.querySelectorAll('.tgl.on').forEach(el=>{ if(el.id!=="m-pair"&&el.id!=="m-piece"&&el.id!=="l-zh"&&el.id!=="l-en") el.classList.remove('on'); });
  setMode(S.mode);
};
setMode('pair');
</script>
